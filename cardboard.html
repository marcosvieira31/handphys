<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>handphys — Cardboard</title>
  </head>
  <body class="cardboard">
    <canvas id="view"></canvas>

    <div id="portrait" class="overlay hidden">
      <p>Gire o celular na <strong>horizontal</strong> para entrar no modo Cardboard.</p>
    </div>

    <div id="gate" class="overlay">
      <div class="gate-box">
        <h1>handphys · Cardboard</h1>
        <p>Os circuitos do editor, na bancada 3D. Toque num componente para ver V e I.</p>
        <div id="examples" class="gate-examples"></div>
        <button id="start" type="button">Entrar (ativa giroscópio)</button>
        <p id="gate-msg" class="msg"></p>
        <p id="gate-log" class="bootlog"></p>
      </div>
    </div>

    <div class="hud-actions">
      <select id="example" class="hud-select" aria-label="Circuito"></select>
      <button id="toggle-stereo" type="button">Estéreo: ON</button>
      <button id="fullscreen" type="button">Tela cheia</button>
      <a href="./" class="hud-link">← início</a>
    </div>

    <div class="legend">Mire 3 s (anel cresce) ou toque = ver V/I · arrastar = girar</div>

    <script>
      // Alarme de carga: se o módulo não rodar (rede falhou, navegador velho,
      // bloqueador), o portão ficaria morto sem explicação. Este script
      // clássico roda mesmo que o módulo falhe.
      window.__cbBoot = false;
      window.__cbReady = false;
      window.__cbLoadErrors = [];
      // captura (true): pega até erro de DOWNLOAD de cada arquivo
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.src || t.href) && t !== window) {
          window.__cbLoadErrors.push(t.src || t.href);
          var m = document.querySelector('#gate-msg');
          if (m) {
            m.textContent = 'Falhou ao baixar: ' + (t.src || t.href).split('/').pop();
            m.style.color = '#ff7b72';
          }
        }
      }, true);
      function cbProgress() {
        // ainda baixando: informa sem alarmar (rede lenta de escola leva tempo)
        if (!window.__cbBoot) {
          var l = document.querySelector('#gate-log');
          if (l && !/aixando/.test(l.textContent || '')) {
            l.textContent += ((l.textContent ? '\n' : '') + 'Baixando o programa… aguarde.');
          }
        }
      }
      function cbAlarm() {
        if (window.__cbReady) return;
        var m = document.querySelector('#gate-msg');
        if (!m) return;
        if (!window.__cbBoot) {
          m.textContent = 'O programa não carregou aqui (rede ou navegador). Recarregue a página ou tente outro navegador.';
          m.style.color = '#ff7b72';
        } else {
          m.textContent = 'Carregou, mas travou iniciando. Recarregue a página.';
          m.style.color = '#d29922';
        }
      }
      setTimeout(cbProgress, 3000);
      setTimeout(cbAlarm, 25000);
    </script>
    <script type="module" src="/src/cardboard/main.ts"></script>
  </body>
</html>
